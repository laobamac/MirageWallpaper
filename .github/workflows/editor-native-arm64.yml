name: Validate native ARM64 editor runtime

on:
  push:
    branches: [codex/native-arm64-editor]
    paths:
      - '.github/workflows/editor-native-arm64.yml'
      - 'StandaloneEditor/tools/build_native_arm64.py'
      - 'StandaloneEditor/Tests/**'
  workflow_dispatch:
    inputs:
      build_runtime:
        description: Build pinned native ARM64 Wine and FEX
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Inspect native host and Metal availability
        shell: bash
        run: |
          mkdir -p StandaloneEditor/build/native-arm64
          clang -arch arm64 -fobjc-arc StandaloneEditor/Tests/NativeHostProbe.m \
            -framework Foundation -framework Metal -o StandaloneEditor/build/native-arm64/host-probe
          StandaloneEditor/build/native-arm64/host-probe | tee StandaloneEditor/build/native-arm64/host.json
          test "$(uname -m)" = arm64
      - name: Build native Wine and FEX
        if: github.event_name == 'push' || inputs.build_runtime
        shell: bash
        run: |
          set -o pipefail
          python3 StandaloneEditor/tools/build_native_arm64.py --install-dependencies \
            2>&1 | tee StandaloneEditor/build/native-arm64/build.log
      - name: Run original x64 instructions through native ARM64 FEX
        if: github.event_name == 'push' || inputs.build_runtime
        shell: bash
        run: |
          work="$PWD/StandaloneEditor/build/native-arm64"
          runtime="$work/hadron/dist-dev"
          "$work/hadron/toolchains/llvm-mingw/bin/x86_64-w64-mingw32-clang" \
            -O2 StandaloneEditor/Tests/WindowsX64Probe.c -o "$work/windows-x64-probe.exe"
          export WINEPREFIX="$work/prefix" WINEARCH=win64 WINEDEBUG=-all
          "$runtime/bin/wineboot" --init > "$work/wineboot.log" 2>&1
          "$runtime/bin/wine" "$work/windows-x64-probe.exe" > "$work/windows-x64.log" 2>&1
          cat "$work/windows-x64.log"
          grep -q MIRAGE_FEX_X64_OK "$work/windows-x64.log"
          "$runtime/bin/wineserver" -k
          "$runtime/bin/wineserver" -w
      - name: Upload native validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-native-arm64-validation
          path: |
            StandaloneEditor/build/native-arm64/host.json
            StandaloneEditor/build/native-arm64/*.log
            StandaloneEditor/build/native-arm64/hadron/dist-dev/mirage-native-build.json
          if-no-files-found: error
          retention-days: 7
