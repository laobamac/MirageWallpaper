name: Build and publish macOS App

on:
  push:
    branches:
      - main
    # Docs-only changes shouldn't rebuild the app. paths-ignore skips a push
    # only when *every* changed file matches, so any app source change still
    # triggers a build. Tag pushes (v*) ignore paths filters and always build.
    paths-ignore:
      - "website/**"
      - "docs/**"
      - ".github/workflows/deploy-website.yml"
      - "**/*.md"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scene_diagnostics:
        description: Build the opt-in scene color diagnostic package
        type: boolean
        default: false

permissions:
  contents: write

# Publishing must be serial: both architectures update the same signed feeds.
concurrency:
  group: mirage-release-publication
  cancel-in-progress: false

jobs:
  build:
    # A release commit only updates version metadata and notes on main. The
    # matching v* tag still performs the authoritative release build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      !startsWith(github.event.head_commit.message, 'chore(release): bump version')
    name: Build and package (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        shell: bash
        run: |
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$newest" ]]; then
            echo "::error::No Xcode found on the runner."
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Selected macOS SDK: $sdk"
          major="${sdk%%.*}"
          if (( major < 26 )); then
            echo "::error::macOS 26 SDK is required to link the current system UI, but the newest available SDK is $sdk. Update the runner image or install Xcode 26."
            exit 1
          fi

      - name: Validate build secret
        shell: bash
        env:
          MIRAGE_STEAM_WEB_API_KEY: ${{ secrets.MIRAGE_STEAM_WEB_API_KEY }}
        run: |
          if [[ ! "$MIRAGE_STEAM_WEB_API_KEY" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::Repository secret MIRAGE_STEAM_WEB_API_KEY is missing or invalid."
            exit 1
          fi

      - name: Install Developer ID certificate and notarization credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          set -euo pipefail
          for variable in APPLE_DEVELOPER_ID_APPLICATION_P12 APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD APPLE_NOTARY_APPLE_ID APPLE_NOTARY_PASSWORD APPLE_DEVELOPER_TEAM_ID; do
            [[ -n "${!variable}" ]] || {
              echo "::error::Repository secret $variable is missing."
              exit 1
            }
          done
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/mirage-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')"
          [[ -n "$identity" && "$identity" != *$'\n'* ]] || {
            echo "::error::The signing certificate secret must contain exactly one Developer ID Application identity."
            exit 1
          }
          [[ "$identity" == "Developer ID Application: "*" ($APPLE_DEVELOPER_TEAM_ID)" ]] || {
            echo "::error::The Developer ID Application certificate does not match APPLE_DEVELOPER_TEAM_ID."
            exit 1
          }
          xcrun notarytool store-credentials mirage-notary \
            --keychain "$keychain_path" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_DEVELOPER_TEAM_ID"
          {
            echo "MIRAGE_SIGN_IDENTITY=$identity"
            echo "MIRAGE_DEVELOPMENT_TEAM=$APPLE_DEVELOPER_TEAM_ID"
            echo "MIRAGE_NOTARY_PROFILE=mirage-notary"
            echo "MIRAGE_NOTARY_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SteamService/packages.lock.json

      - name: Build optional private Workshop component
        shell: bash
        env:
          MIRAGE_DIRECT_WORKSHOP_REPOSITORY: ${{ vars.MIRAGE_DIRECT_WORKSHOP_REPOSITORY }}
          MIRAGE_DIRECT_WORKSHOP_REF: ${{ vars.MIRAGE_DIRECT_WORKSHOP_REF }}
          MIRAGE_DIRECT_WORKSHOP_DEPLOY_KEY: ${{ secrets.MIRAGE_DIRECT_WORKSHOP_DEPLOY_KEY }}
        run: bash Mirage/scripts/build_direct_workshop_ci.sh

      - name: Install build dependencies
        shell: bash
        run: |
          brew install cmake ninja pkg-config llvm@22 vulkan-loader \
            vulkan-headers glslang glfw freetype fontconfig lz4 ffmpeg dav1d nasm

      - name: Compute codec cache fingerprint
        id: codecs
        shell: bash
        run: |
          fingerprint="$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; brew list --versions dav1d nasm; } | shasum -a 256 | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache decoder-only FFmpeg
        uses: actions/cache@v4
        with:
          path: Mirage/build/ffmpeg/${{ matrix.arch }}
          key: ffmpeg-${{ runner.os }}-${{ matrix.arch }}-${{ steps.codecs.outputs.fingerprint }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build decoder-only FFmpeg
        shell: bash
        run: ./scripts/build_ffmpeg.sh "${{ matrix.arch }}"

      - name: Test asset and runtime packaging
        shell: bash
        run: python3 Mirage/Tests/run_bundle_optimization.py

      - name: Test production MoltenVK packaging
        shell: bash
        run: python3 Mirage/Tests/run_moltenvk_packaging.py

      - name: Build renderers
        shell: bash
        env:
          LLVM_FORMULA: llvm@22
        run: |
          ./SceneRenderer/scripts/build.sh release
          ./WebRenderer/scripts/build.sh release
          ./VideoRenderer/scripts/build.sh release

      - name: Test scene diagnostics
        shell: bash
        run: python3 Mirage/Tests/run_scene_diagnostics.py

      - name: Build protected production MoltenVK
        shell: bash
        run: python3 Mirage/scripts/build_moltenvk.py --mode production --output "$RUNNER_TEMP/MoltenVKProduction"

      - name: Build controlled diagnostic libraries
        if: github.event_name == 'workflow_dispatch' && inputs.scene_diagnostics
        shell: bash
        run: python3 Mirage/scripts/build_scene_diagnostics.py --output "$RUNNER_TEMP/SceneDiagnostics"

      - name: Build app bundle
        shell: bash
        env:
          MIRAGE_ARCH: ${{ matrix.arch }}
          MIRAGE_STEAM_WEB_API_KEY: ${{ secrets.MIRAGE_STEAM_WEB_API_KEY }}
          MIRAGE_GIT_COMMIT: ${{ github.sha }}
          MIRAGE_MOLTENVK_DIR: ${{ runner.temp }}/MoltenVKProduction
          MIRAGE_SCENE_DIAGNOSTICS_DIR: ${{ inputs.scene_diagnostics && format('{0}/SceneDiagnostics', runner.temp) || '' }}
        run: ./Mirage/scripts/build.sh Release

      - name: Verify app bundle
        shell: bash
        run: |
          app="Mirage/dist/Mirage.app"
          expected_build="$(git rev-list --count "$GITHUB_SHA")"
          test -d "$app"
          test -x "$app/Contents/Resources/Renderers/SceneWallpaper"
          test -x "$app/Contents/Resources/Renderers/WebWallpaper"
          test -x "$app/Contents/Resources/Renderers/VideoWallpaper"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          service="$app/Contents/Resources/SteamService/${{ matrix.arch }}"
          test -x "$service/runtime/dotnet"
          test -f "$service/app/MirageSteamService.dll"
          test -f "$service/app/SteamKit2.dll"
          test -f "$app/Contents/Resources/SteamService/Licenses/LGPL-2.1.txt"
          test -f "$app/Contents/Resources/SteamService/Licenses/SteamKit2-NOTICE.txt"
          test -f "$app/Contents/Resources/SteamService/Licenses/dotnet-LICENSE.txt"
          test -f "$app/Contents/Resources/SteamService/Licenses/dotnet-ThirdPartyNotices.txt"
          file "$service/runtime/dotnet" | grep -q '${{ matrix.arch }}'
          while IFS= read -r -d '' item; do
            if file "$item" | grep -q 'Mach-O'; then
              team="$(codesign -dvvv "$item" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              [[ "$team" == 'UBF8T346G9' ]]
            fi
          done < <(find "$service/runtime" -type f -print0)
          ipc_log="$RUNNER_TEMP/mirage-steam-service.jsonl"
          printf '%s\n' \
            '{"command":"hello","requestId":"hello-ci"}' \
            '{"command":"ping","requestId":"ping-ci"}' \
            '{"command":"shutdown","requestId":"shutdown-ci"}' \
            | DOTNET_ROOT="$service/runtime" "$service/runtime/dotnet" "$service/app/MirageSteamService.dll" > "$ipc_log"
          [[ "$(wc -l < "$ipc_log" | tr -d ' ')" == "3" ]]
          grep -q '"type":"hello"' "$ipc_log"
          grep -q '"type":"pong"' "$ipc_log"
          grep -q '"requestId":"shutdown-ci"' "$ipc_log"
          if [[ -n "${MIRAGE_DIRECT_WORKSHOP_BUNDLE:-}" ]]; then
            private="$app/Contents/Resources/DirectWorkshop"
            test -f "$private/Licenses/MirageDirectWorkshop-LICENSE.txt"
            test -f "$private/Licenses/LGPL-2.1.txt"
            test -f "$private/Licenses/SteamKit2-NOTICE.txt"
            cmp "$MIRAGE_DIRECT_WORKSHOP_BUNDLE/MirageDirectWorkshop.dll" "$private/MirageDirectWorkshop.dll"
            python3 - "$service/runtime" "$private/MirageDirectWorkshop.dll" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          runtime, assembly = (Path(value).resolve() for value in sys.argv[1:])
          environment = dict(os.environ, DOTNET_ROOT=str(runtime), DOTNET_MULTILEVEL_LOOKUP="0")
          command = [str(runtime / "dotnet"), str(assembly)]
          device = subprocess.run(command, input=json.dumps({"command": "device"}) + "\n",
                                  text=True, capture_output=True, env=environment, timeout=20)
          assert device.returncode == 0, "Packaged private component failed to start"
          response = json.loads(device.stdout)
          assert response.get("success") is True and len(response.get("deviceCode", "")) == 64
          rejected = subprocess.run(command, input=json.dumps({"command": "verify", "activationCode": "invalid-ci-code"}) + "\n",
                                    text=True, capture_output=True, env=environment, timeout=20)
          assert rejected.returncode != 0 and json.loads(rejected.stdout).get("errorCode") == "ACTIVATION_INVALID"
          print("Private component runtime and activation rejection verified.")
          PY
          fi
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          codesign -dvv "$sparkle/Sparkle" 2>&1 | grep -q 'flags=.*runtime'
          sparkle_entitlements="$RUNNER_TEMP/sparkle-entitlements.plist"
          codesign -d --entitlements "$sparkle_entitlements" --xml "$sparkle/Autoupdate"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$sparkle_entitlements")" == 'org.sparkle-project.Sparkle.Autoupdate' ]]
          app_entitlements="$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements "$app_entitlements" --xml "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.allow-jit' "$app_entitlements")" == 'true' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$app_entitlements")" == 'true' ]]
          codesign --verify --deep --strict "$app"
          python3 Mirage/scripts/build_moltenvk.py --verify-bundle "$app"
          python3 Mirage/scripts/scene_runtime_manifest.py "$app" --verify
          python3 Mirage/Tests/run_codec_packaging.py --app "$app"
          python3 Mirage/Tests/run_bundle_optimization.py --app "$app"
          bash Mirage/scripts/report_bundle_size.sh "$app" 260
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" == "$expected_build" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :MirageGitCommit' "$app/Contents/Info.plist")" == "$GITHUB_SHA" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")" == '/klI6Qh2rkydyEwm7lIAgZppwGitkU1YtQhoy75hkXg=' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" == *"appcast-${{ matrix.arch }}.xml" ]]
          built_in_key="$(/usr/libexec/PlistBuddy -c 'Print :MirageSteamWebAPIKey' "$app/Contents/Info.plist")"
          [[ "$built_in_key" =~ ^[A-Fa-f0-9]{32}$ ]]
          codesign -dvvv "$app" 2>&1 | grep -Fq "Authority=$MIRAGE_SIGN_IDENTITY"
          codesign -dvvv "$app" 2>&1 | grep -Fq "TeamIdentifier=$MIRAGE_DEVELOPMENT_TEAM"
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Package app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count "$GITHUB_SHA")"
          short_commit="${GITHUB_SHA:0:12}"
          package="Mirage-${build_number}-${short_commit}-macOS-${{ matrix.arch }}${{ inputs.scene_diagnostics && '-diagnostic' || '' }}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "Mirage/dist/Mirage.app" "Mirage/dist/$package"
          shasum -a 256 "Mirage/dist/$package" > "Mirage/dist/$package.sha256"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Mirage-${{ steps.package.outputs.build_number }}-macOS-${{ matrix.arch }}${{ inputs.scene_diagnostics && '-diagnostic' || '' }}
          path: |
            Mirage/dist/${{ steps.package.outputs.package }}
            Mirage/dist/${{ steps.package.outputs.package }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mirage-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"

      - name: Remove private Workshop build output
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/mirage-direct-workshop-bundle"

  publish:
    name: Publish ${{ github.ref_type == 'tag' && 'stable release' || 'pre-release' }} and update feeds
    needs: build
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Resolve Sparkle publishing tools
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -project 'Mirage/Mirage Wallpaper.xcodeproj' \
            -scheme 'Mirage Wallpaper' \
            -derivedDataPath Mirage/build/DD

      - name: Create or replace the GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count "$GITHUB_SHA")"
          short_commit="${GITHUB_SHA:0:12}"
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.sha256' \) -exec cp {} release-assets/ \;

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="Mirage ${GITHUB_REF_NAME}"
          else
            release_tag="prerelease"
            release_title="Mirage Pre-release ${short_commit}"
            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$release_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          release_notes_source=".github/release-notes/${release_tag}.md"
          if [[ "$GITHUB_REF_TYPE" == "tag" && -f "$release_notes_source" ]]; then
            cp "$release_notes_source" "$notes_file"
          else
            {
              echo "Commit: \`${GITHUB_SHA}\`"
              echo
              git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
            } > "$notes_file"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file"
          else
            gh release create "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes-file "$notes_file" \
              --prerelease
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "channel=$([[ "$GITHUB_REF_TYPE" == "tag" ]] && printf stable || printf beta)" >> "$GITHUB_OUTPUT"

      - name: Ensure update-feed branch exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/update-feeds" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/heads/update-feeds' \
              -f sha="$GITHUB_SHA"
          fi

      - name: Check out update feeds
        uses: actions/checkout@v6
        with:
          ref: update-feeds
          path: update-feeds
          fetch-depth: 1

      - name: Generate signed architecture appcasts
        shell: bash
        env:
          MIRAGE_SPARKLE_PRIVATE_KEY: ${{ secrets.MIRAGE_SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ -n "$MIRAGE_SPARKLE_PRIVATE_KEY" ]] || {
            echo '::error::Repository secret MIRAGE_SPARKLE_PRIVATE_KEY is missing.'
            exit 1
          }
          tool='Mirage/build/DD/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast'
          test -x "$tool"

          for arch in x86_64 arm64; do
            archive="$(find artifacts -type f -name "*macOS-${arch}.zip" -print -quit)"
            test -n "$archive"
            appcast_dir="$RUNNER_TEMP/appcast-${arch}"
            mkdir -p "$appcast_dir"
            cp "$archive" "$appcast_dir/"
            if [[ -f "update-feeds/appcast-${arch}.xml" ]]; then
              cp "update-feeds/appcast-${arch}.xml" "$appcast_dir/appcast-${arch}.xml"
            fi
            archive_name="$(basename "$archive" .zip)"
            release_notes_source=".github/release-notes/${RELEASE_TAG}.md"
            if [[ "$RELEASE_CHANNEL" == stable && -f "$release_notes_source" ]]; then
              sed \
                -e '/^<details>$/d' \
                -e '/^<summary>.*<\/summary>$/d' \
                -e '/^<\/details>$/d' \
                "$release_notes_source" > "$appcast_dir/${archive_name}.md"
            else
              {
                echo "Commit: ${GITHUB_SHA}"
                echo "Channel: ${RELEASE_CHANNEL}"
                echo
                git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
              } > "$appcast_dir/${archive_name}.txt"
            fi

            command=("$tool" --ed-key-file - --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" --link "https://github.com/${GITHUB_REPOSITORY}" --embed-release-notes --versions "$BUILD_NUMBER" --maximum-versions 6 --maximum-deltas 0)
            if [[ "$RELEASE_CHANNEL" == beta ]]; then
              command+=(--channel beta)
            fi
            command+=("$appcast_dir")
            printf '%s' "$MIRAGE_SPARKLE_PRIVATE_KEY" | "${command[@]}"
            cp "$appcast_dir/appcast-${arch}.xml" "update-feeds/appcast-${arch}.xml"
          done

      - name: Publish update feeds
        shell: bash
        run: |
          set -euo pipefail
          git -C update-feeds config user.name 'github-actions[bot]'
          git -C update-feeds config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C update-feeds add appcast-x86_64.xml appcast-arm64.xml
          if ! git -C update-feeds diff --cached --quiet; then
            git -C update-feeds commit -m "chore(update): publish ${{ steps.release.outputs.channel }} ${{ github.sha }}"
            git -C update-feeds push origin HEAD:update-feeds
          fi
